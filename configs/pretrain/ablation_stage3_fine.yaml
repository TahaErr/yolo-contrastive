# =============================================================================
# Stage 3 — Fine ablation (best mode/queue × λ × t_scale grid, paper-final)
# =============================================================================
# Purpose:
#   Final paper numbers. Uses the Stage 2 winner (best mode × queue
#   combination) and explores the SAPS hyperparameters λ (mixing weight for
#   saps_mode='both') and t_scale (cross-level temperature for cross/both).
#
# Grid:
#   saps_both_lambda ∈ {0.5, 1.0, 2.0}     (only meaningful when mode='both')
#   saps_t_scale     ∈ {0.5, 1.0, 2.0}     (only meaningful when mode in
#                                            {'cross', 'both'})
#   saps_mode, queue_update_strategy: FROZEN from Stage 2 (fill below)
#
# Expansion (when mode='both' wins Stage 2):
#   3 × 3 = 9 cells × 1 seed = 9 runs.
#   Estimated: ~11 hr/cell on A100 (186K full pool, 100 epoch) ≈ 100 hr.
#
# Expansion (when mode='cross' wins):
#   Single λ value (irrelevant), 3 t_scale = 3 cells. λ-collapse activates.
#
# Expansion (when mode='none' or 'within' wins):
#   Both axes collapse to single representative point → 1 cell.
#   In this scenario, Stage 3 is essentially a confirmation re-run; consider
#   replacing with multi-seed of the winning Stage 2 config instead.
#
# ── TODO BEFORE RUNNING ─────────────────────────────────────────────────
# After Stage 2 completes:
#   1. Inspect /content/runs/ablation_stage2/results.csv
#   2. Find winning (saps_mode, queue_update_strategy) by acc@1 → final loss
#   3. Fill the BEST_MODE and BEST_QUEUE placeholders in `base:` below
#   4. Verify the exclusion rules align with the winning mode (see comments
#      next to `exclude:` for variants)
# ─────────────────────────────────────────────────────────────────────────
#
# Prerequisite — full pool:
#   /content/ssl_pool_local (~10 GB) materialized from
#   /content/drive/MyDrive/yolo-contrastive/ssl_pool/. Drive-read per-image
#   is too slow for Stage 3's training loop; local SSD is required.
# =============================================================================

task: pretrain
output_csv: /content/runs/ablation_stage3/results.csv

base:
  # ── Data ──────────────────────────────────────────────────────────────
  images_dir: /content/ssl_pool_local

  # ── Model ─────────────────────────────────────────────────────────────
  model: yolov8n.pt
  imgsz: 640
  out_dim: 128
  queue_size: 65536
  momentum: 0.999
  temperature: 0.2
  n_query: 128
  pos_radius: 0.07
  match_mode: threshold
  device: cuda

  # ── FROZEN axes from Stage 2 — FILL THESE IN ──────────────────────────
  saps_mode: <FILL_FROM_STAGE2>                  # e.g. both
  queue_update_strategy: <FILL_FROM_STAGE2>      # e.g. per_position
  queue_subsample_n: 16

  # ── Training ──────────────────────────────────────────────────────────
  epochs: 100
  batch_size: 64
  lr: 1.0e-3
  warmup_epochs: 5
  num_workers: 8
  print_every: 500
  output_dir: /content/runs/ablation_stage3

# ── Varying axes ────────────────────────────────────────────────────────
grid:
  saps_both_lambda: [0.5, 1.0, 2.0]
  saps_t_scale: [0.5, 1.0, 2.0]

seeds: [42]

# ── Exclusions (§10.24a DSL — paper-quotable redundancy elimination) ─────
# Comment/uncomment the block matching Stage 2's winning mode. Without these,
# the grid wastes compute on parameter values the loss function ignores.
#
# Variant A — winning mode = 'both' (most common case)
#   λ and t_scale BOTH meaningful. No exclusions needed; full 3×3 grid runs.
exclude: []
#
# Variant B — winning mode = 'cross'
#   λ ignored entirely (no within term). Keep only λ=1.0 representative.
# exclude:
#   - saps_both_lambda: [0.5, 2.0]   # all-but-representative
#
# Variant C — winning mode = 'within'
#   Both λ AND t_scale ignored. Grid collapses to 1 cell — consider running
#   multi-seed instead of this Stage 3.
# exclude:
#   - saps_both_lambda: [0.5, 2.0]
#     saps_t_scale: [0.5, 2.0]
#
# Variant D — winning mode = 'none'
#   No SAPS at all. Same as Variant C — collapses to 1 cell.
